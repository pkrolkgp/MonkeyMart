name: Temporary network modules snapshot
on:
  push:
    paths:
      - .github/workflows/temp-network-modules.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: user-original-multiplayer-transport-modules
          path: multiplayer/
          retention-days: 1
          if-no-files-found: error
