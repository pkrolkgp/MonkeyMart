name: Monkey Mart - private full Defold macOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'private_inputs/source-project.zip'
      - 'resources.zip'
      - 'tools/private_build/**'
      - '.github/workflows/private-defold-build.yml'

permissions:
  contents: read

jobs:
  validate-build-tooling:
    name: Validate recovery and build preparation scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no copyrighted assets)
        run: python3 -m unittest discover -s tools/private_build -p 'test_*.py' -v

  compile-private-project:
    name: Compile real sources for Apple Silicon
    needs: validate-build-tooling
    if: ${{ github.event.repository.private == true }}
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Require private sources
        shell: bash
        run: |
          if [[ ! -f private_inputs/source-project.zip ]]; then
            echo 'ERROR: private_inputs/source-project.zip is absent; no original source bundle uploaded.' >&2
            exit 1
          fi
      - name: Use Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Restore original seven LiveUpdate scenes
        env:
          RECOVERY_OUTPUT: ${{ runner.temp }}/liveupdate
        run: python3 tools/recover_liveupdate_ci.py
      - name: Unpack complete private Defold source
        shell: bash
        run: |
          set -euo pipefail
          project_relative="$(python3 tools/private_build/validate_source_zip.py \
            private_inputs/source-project.zip --extract-to "$RUNNER_TEMP/source-stage")"
          source_dir="$RUNNER_TEMP/source-stage/$(dirname "$project_relative")"
          if [[ ! -f "$source_dir/game.project" ]]; then
            echo 'ERROR: validated game.project missing after extraction' >&2
            exit 1
          fi
          echo "DEFOLD_SOURCE=$source_dir" >> "$GITHUB_ENV"
      - name: Fix original paths and validate actual assets
        shell: bash
        run: |
          python3 tools/private_build/prepare.py "$DEFOLD_SOURCE" \
            --restored "$RUNNER_TEMP/liveupdate/source" \
            --report "$RUNNER_TEMP/preflight.json"
      - name: Download verified Defold Bob 1.14.0
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/bob.jar" \
            https://github.com/defold/defold/releases/download/1.14.0/bob.jar
          echo "d8cbe667757ca1c5f4dfd251bc98660c35e7a65ac84bf0207ccef7607de6d1a1  $RUNNER_TEMP/bob.jar" | shasum -a 256 -c -
      - name: Compile and bundle original game for arm64-osx
        shell: bash
        run: |
          set -o pipefail
          cd "$DEFOLD_SOURCE"
          java -jar "$RUNNER_TEMP/bob.jar" --platform arm64-macos --archive \
            resolve distclean build bundle 2>&1 | tee "$RUNNER_TEMP/defold-build.log"
      - name: Verify actual Apple Silicon app and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "ERROR: expected Apple Silicon runner, got $(uname -m)" >&2
            exit 1
          fi
          APP="$(python3 tools/private_build/verify_bundle.py "$DEFOLD_SOURCE/build")"
          mkdir -p "$GITHUB_WORKSPACE/out"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/out/MonkeyMart-macOS-arm64.zip"
      # Private repository visibility does not establish redistribution rights.
      # Uploading the compiled game requires an explicit owner-controlled opt-in.
      - name: Publish private compiled app (only when distribution is authorized)
        if: ${{ success() && github.event.repository.private == true && vars.MONKEYMART_DISTRIBUTION_AUTHORIZED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyMart-macOS-AppleSilicon
          path: out/MonkeyMart-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-build-diagnostics
          path: |
            ${{ runner.temp }}/defold-build.log
            ${{ runner.temp }}/preflight.json
          if-no-files-found: ignore
          retention-days: 7
